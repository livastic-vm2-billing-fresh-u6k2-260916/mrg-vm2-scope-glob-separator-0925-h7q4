name: scope-report-ready

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scope-report-ready:
    name: scope-report-ready
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted victim
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch external PR head object without executing it
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 "https://github.com/${HEAD_REPO}.git" "${HEAD_SHA}"

      - name: First-party default scope detection
        id: old
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          mergify_config_path: .mergify.yml

      - name: Record first-party default result
        env:
          SCOPES_JSON: ${{ steps.old.outputs.scopes }}
        run: |
          mergify --version
          echo "OLD_SCOPES=${SCOPES_JSON}"

      - name: Protected scoped test
        if: ${{ fromJSON(steps.old.outputs.scopes).protected == 'true' }}
        run: |
          echo "VM2_PROTECTED_SCOPE_TEST_RAN=true"
          exit 1

      - name: Aggregate gate
        run: echo "VM2_SCOPE_REPORT_READY=true"

  current-parity:
    name: current-parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted victim
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch external PR head object without executing it
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 "https://github.com/${HEAD_REPO}.git" "${HEAD_SHA}"

      - name: Current released scope detection
        id: current
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_cli_version: latest
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          mergify_config_path: .mergify.yml

      - name: Require current semantics to see protected
        env:
          PROTECTED: ${{ fromJSON(steps.current.outputs.scopes).protected }}
          SCOPES_JSON: ${{ steps.current.outputs.scopes }}
        run: |
          mergify --version
          echo "CURRENT_SCOPES=${SCOPES_JSON}"
          test "${PROTECTED}" = "true"
